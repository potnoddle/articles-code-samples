<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astra Mechanistic Oversight: Token Deliberation Sankey Flow</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #0a0a14;
      --card-bg: rgba(20, 20, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f5ff;
      --purple: #a855f7;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #00f5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      height: calc(100vh - 120px);
    }
    #sankey-plot {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Token Deliberation Sankey Flow</h1>
  <p>Tracing how probability mass transitions and coalesces across recurrent computational passes</p>
</div>

<div class="card">

</div>

  Plotly.newPlot('sankey-plot', data, layout, { responsive: true, displaylogo: false });
</script>

</body>
</html>
