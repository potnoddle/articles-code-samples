<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astra Mechanistic Oversight: Interactive Logit Lens Grid</title>
  <style>
    :root {
      --bg: #0a0a14;
      --card-bg: rgba(20, 20, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f5ff;
      --purple: #a855f7;
      --pink: #ff4d6d;
      --green: #50fa7b;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #00f5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
    .matrix-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--border);
      font-size: 12px;
    }
    th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--cyan);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    .loop-header {
      color: var(--purple);
      font-weight: 700;
      background: rgba(168, 85, 247, 0.08);
      text-align: left;
      padding-left: 12px;
      white-space: nowrap;
    }
    .cell {
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .cell:hover {
      transform: scale(1.05);
      z-index: 10;
      box-shadow: 0 0 12px rgba(0, 245, 255, 0.5);
      border-color: var(--cyan);
    }
    .cell-word {
      font-weight: 700;
      display: block;
    }
    .cell-prob {
      font-size: 10px;
      color: var(--text-dim);
    }
    .modal {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #141426;
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      z-index: 100;
      min-width: 260px;
    }
  </style>
</head>

    <tbody id="lens-body"></tbody>

</div>

    tr.appendChild(loopTh);

      td.className = 'cell';

      td.style.backgroundColor = `rgba(0, 245, 255, ${alpha})`;
      
      td.innerHTML = `
        <span class="cell-word">${cell.word}</span>
        <span class="cell-prob">${cell.prob}%</span>
      `;
      td.onmouseenter = () => showModal(lIdx, pos, cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

  function showModal(loopIdx, pos, cell) {

    document.getElementById('modal-title').innerText = `${payload.loops[loopIdx]} @ Pos ${pos} ("${payload.tokens[pos]}")`;

        <span style="color: var(--cyan);">${item.prob}%</span>
      </div>

    document.getElementById('modal-top3').innerHTML = top3Html;
  }
  document.body.onclick = () => modal.style.display = 'none';
