name: Brand Constitution Validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.markdown'

jobs:
  brand-audit:
    name: Audit Markdown for Brand Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Brand Constitution Linter
        run: |
          find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/.git/*" | while read file; do
            python linter/validate_brand.py "$file"
          done
